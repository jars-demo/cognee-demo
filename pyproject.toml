[project]
name = "cognee-demo"
version = "0.1.0"
description = "A hands-on workshop app for cognee: turn text into a knowledge graph, then ask it questions."
readme = "README.md"
requires-python = ">=3.10,<3.14"
# Direct dependencies are pinned exactly, so every attendee runs the same versions.
# requirements.txt pins the full dependency tree for pip users (generated from uv.lock).
dependencies = [
    "cognee==1.6.2",
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
